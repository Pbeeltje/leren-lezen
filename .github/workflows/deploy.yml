name: Publiceer op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standaard alleen lezen; schrijfrechten voor Pages alleen in de publiceer-stap.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
