<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Een stegosaurus, zelf getekend voor leren-lezen (kijkt naar links, zoals de Fluent-dieren). -->
  <defs>
    <linearGradient id="steg-lijf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6a4"/>
      <stop offset="1" stop-color="#2f9f73"/>
    </linearGradient>
    <linearGradient id="steg-poot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fae80"/>
      <stop offset="1" stop-color="#23805c"/>
    </linearGradient>
    <linearGradient id="steg-plaat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="1" stop-color="#f27a2e"/>
    </linearGradient>
    <radialGradient id="steg-glans" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- rugplaten (achter het lijf) -->
  <g fill="url(#steg-plaat)" stroke="#c4561c" stroke-width="2" stroke-linejoin="round">
    <path d="M34 52 L38 34 L48 48 Z"/>
    <path d="M44 46 L52 22 L62 42 Z"/>
    <path d="M58 41 L68 14 L78 40 Z"/>
    <path d="M74 41 L86 20 L92 45 Z"/>
    <path d="M88 47 L101 32 L102 54 Z"/>
  </g>
  <!-- staart met stekels -->
  <path d="M96 66 C106 66 112 62 117 54 C116 66 108 76 96 80 Z" fill="url(#steg-lijf)" stroke="#1d6b4c" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#fff3d6" stroke="#b08850" stroke-width="1.5" stroke-linejoin="round">
    <path d="M110 60 L118 46 L114 62 Z"/>
    <path d="M113 57 L119 52 L116 60 Z"/>
  </g>
  <!-- achterpoten -->
  <rect x="78" y="76" width="16" height="28" rx="7" fill="url(#steg-poot)" stroke="#1d6b4c" stroke-width="2.5"/>
  <rect x="40" y="78" width="15" height="26" rx="7" fill="url(#steg-poot)" stroke="#1d6b4c" stroke-width="2.5"/>
  <!-- lijf -->
  <path d="M24 70 C24 50 46 40 66 40 C88 40 102 52 102 66 C102 80 88 86 64 86 C42 86 24 84 24 70 Z" fill="url(#steg-lijf)" stroke="#1d6b4c" stroke-width="2.5"/>
  <path d="M30 66 C34 52 50 45 66 45 C80 45 92 50 96 58 C82 54 52 54 30 66 Z" fill="url(#steg-glans)"/>
  <!-- buik -->
  <path d="M34 76 C46 82 72 84 92 76 C86 84 72 86 62 86 C48 86 38 82 34 76 Z" fill="#c8f0d4" opacity="0.8"/>
  <!-- stippen -->
  <circle cx="60" cy="56" r="3.5" fill="#bdf0d1"/>
  <circle cx="74" cy="60" r="2.8" fill="#bdf0d1"/>
  <circle cx="48" cy="62" r="2.5" fill="#bdf0d1"/>
  <!-- voorpoten -->
  <rect x="66" y="80" width="15" height="26" rx="7" fill="url(#steg-poot)" stroke="#1d6b4c" stroke-width="2.5"/>
  <rect x="28" y="78" width="14" height="27" rx="7" fill="url(#steg-poot)" stroke="#1d6b4c" stroke-width="2.5"/>
  <!-- nek en kop -->
  <path d="M32 66 C26 62 20 62 14 64 C6 66 3 72 6 77 C9 82 17 82 24 79 C30 77 34 73 34 70 Z" fill="url(#steg-lijf)" stroke="#1d6b4c" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="13" cy="70" r="3.4" fill="#ffffff"/>
  <circle cx="12.4" cy="70.3" r="2" fill="#1b1b2f"/>
  <circle cx="11.8" cy="69.5" r="0.7" fill="#ffffff"/>
  <path d="M7 77 C10 79 14 79 17 78" stroke="#1d6b4c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="20" cy="75" r="2.2" fill="#ff9aa2" opacity="0.7"/>
</svg>
