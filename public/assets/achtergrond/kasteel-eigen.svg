<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" overflow="visible">
  <defs>
    <linearGradient id="ks-muur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6fc"/>
      <stop offset="1" stop-color="#f0d6ea"/>
    </linearGradient>
    <linearGradient id="ks-muur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e9ff"/>
      <stop offset="1" stop-color="#dfc8f2"/>
    </linearGradient>
    <linearGradient id="ks-dak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff86bb"/>
      <stop offset="1" stop-color="#e04e8e"/>
    </linearGradient>
    <linearGradient id="ks-dak2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c79bff"/>
      <stop offset="1" stop-color="#9563e0"/>
    </linearGradient>
    <linearGradient id="ks-koepel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3d9"/>
      <stop offset="1" stop-color="#e2508f"/>
    </linearGradient>
    <linearGradient id="ks-raam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </linearGradient>
    <pattern id="ks-snoep" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="22" height="22" fill="#fff6fc"/>
      <rect width="22" height="9" fill="#ff9cc9"/>
    </pattern>
  </defs>

  <!-- ===== achterste laag ===== -->
  <!-- dunne spits met hartje (achter links) -->
  <rect x="98" y="70" width="22" height="200" fill="url(#ks-muur2)" stroke="#9c6aa8" stroke-width="2.5"/>
  <path d="M92 74 L109 10 L126 74 Z" fill="url(#ks-dak2)" stroke="#6e3fb0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M109 12 C105 4 97 6 97 12 C97 18 109 24 109 24 C109 24 121 18 121 12 C121 6 113 4 109 12 Z" fill="#ff6fae" stroke="#b8407e" stroke-width="2"/>
  <!-- snoepgestreepte toren (achter rechts) -->
  <rect x="286" y="96" width="40" height="190" fill="url(#ks-snoep)" stroke="#9c6aa8" stroke-width="2.5"/>
  <path d="M278 100 L306 30 L334 100 Z" fill="url(#ks-dak)" stroke="#a83468" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M306 30 L306 12" stroke="#7a5a8c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M306 12 L324 17 L306 23 Z" fill="#ffd54f" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/>

  <!-- ===== zijtorens ===== -->
  <rect x="44" y="150" width="56" height="150" rx="4" fill="url(#ks-muur)" stroke="#9c6aa8" stroke-width="3"/>
  <path d="M36 154 L72 70 L108 154 Z" fill="url(#ks-dak)" stroke="#a83468" stroke-width="3" stroke-linejoin="round"/>
  <path d="M72 70 L72 46" stroke="#7a5a8c" stroke-width="3" stroke-linecap="round"/>
  <path d="M72 46 L94 52 L72 59 Z" fill="#7ec8ff" stroke="#3b82b8" stroke-width="2" stroke-linejoin="round"/>
  <rect x="300" y="150" width="56" height="150" rx="4" fill="url(#ks-muur)" stroke="#9c6aa8" stroke-width="3"/>
  <path d="M292 154 L328 70 L364 154 Z" fill="url(#ks-dak2)" stroke="#6e3fb0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M328 70 L328 46" stroke="#7a5a8c" stroke-width="3" stroke-linecap="round"/>
  <path d="M328 46 L350 52 L328 59 Z" fill="#ff86bb" stroke="#a83468" stroke-width="2" stroke-linejoin="round"/>

  <!-- kleine buitenste torentjes -->
  <rect x="10" y="222" width="32" height="80" rx="3" fill="url(#ks-muur2)" stroke="#9c6aa8" stroke-width="2.5"/>
  <path d="M5 225 L26 180 L47 225 Z" fill="url(#ks-dak2)" stroke="#6e3fb0" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="26" cy="180" r="4" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="358" y="222" width="32" height="80" rx="3" fill="url(#ks-muur2)" stroke="#9c6aa8" stroke-width="2.5"/>
  <path d="M353 225 L374 180 L395 225 Z" fill="url(#ks-dak)" stroke="#a83468" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="374" cy="180" r="4" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/>

  <!-- vlaggetjeslijn tussen de zijtorens -->
  <path d="M72 120 Q200 170 328 120" fill="none" stroke="#9c6aa8" stroke-width="2"/>
  <g stroke="#9c6aa8" stroke-width="1.2" stroke-linejoin="round">
    <path d="M100 128 L112 132 L104 144 Z" fill="#ff86bb"/>
    <path d="M128 136 L140 139 L132 152 Z" fill="#ffd54f"/>
    <path d="M156 141 L168 143 L160 156 Z" fill="#7ec8ff"/>
    <path d="M184 144 L196 145 L189 158 Z" fill="#c79bff"/>
    <path d="M212 144 L224 144 L217 157 Z" fill="#ff86bb"/>
    <path d="M240 141 L252 140 L245 153 Z" fill="#ffd54f"/>
    <path d="M268 136 L280 133 L274 147 Z" fill="#7ec8ff"/>
    <path d="M294 128 L306 124 L301 138 Z" fill="#c79bff"/>
  </g>

  <!-- ===== middenmuur met kantelen ===== -->
  <path d="M92 196 L92 180 L106 180 L106 190 L120 190 L120 180 L134 180 L134 190 L148 190 L148 180 L252 180 L252 190 L266 190 L266 180 L280 180 L280 190 L294 190 L294 180 L308 180 L308 196 L308 312 L92 312 Z" fill="url(#ks-muur)" stroke="#9c6aa8" stroke-width="3" stroke-linejoin="round"/>

  <!-- ===== hoofdtoren met uienkoepel ===== -->
  <rect x="150" y="96" width="100" height="130" rx="5" fill="url(#ks-muur)" stroke="#9c6aa8" stroke-width="3"/>
  <!-- balkon -->
  <rect x="140" y="150" width="120" height="8" rx="3" fill="#e9b8dc" stroke="#9c6aa8" stroke-width="2.5"/>
  <path d="M146 150 L146 140 M158 150 L158 140 M170 150 L170 140 M230 150 L230 140 M242 150 L242 140 M254 150 L254 140 M142 140 L258 140" stroke="#9c6aa8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M150 100 C150 60 176 50 200 22 C224 50 250 60 250 100 Z" fill="url(#ks-koepel)" stroke="#a83468" stroke-width="3" stroke-linejoin="round"/>
  <path d="M172 94 C174 72 186 60 200 44 M228 94 C226 72 214 60 200 44" fill="none" stroke="#ffd0e6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M200 22 L200 6" stroke="#b8860b" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 -4 L204 6 L214 6 L206 12 L209 22 L200 16 L191 22 L194 12 L186 6 L196 6 Z" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- roosvenster -->
  <circle cx="200" cy="120" r="16" fill="url(#ks-raam)" stroke="#9c6aa8" stroke-width="3"/>
  <path d="M200 104 L200 136 M184 120 L216 120 M189 109 L211 131 M211 109 L189 131" stroke="#e8a6c8" stroke-width="1.6"/>
  <path d="M200 118 C198 114 193 115 193 119 C193 123 200 127 200 127 C200 127 207 123 207 119 C207 115 202 114 200 118 Z" fill="#ff6fae"/>

  <!-- bruggetje van linker toren naar hoofdtoren -->
  <path d="M100 196 L150 196 L150 204 C136 204 128 214 125 222 C122 214 114 204 100 204 Z" fill="url(#ks-muur2)" stroke="#9c6aa8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ramen: class 'raam' zodat CSS ze kan laten twinkelen -->
  <g stroke="#9c6aa8" stroke-width="2.5">
    <path class="raam" d="M63 196 L63 184 C63 176 81 176 81 184 L81 196 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M63 246 L63 234 C63 226 81 226 81 234 L81 246 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M319 196 L319 184 C319 176 337 176 337 184 L337 196 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M319 246 L319 234 C319 226 337 226 337 234 L337 246 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M168 200 L168 190 C168 184 180 184 180 190 L180 200 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M220 200 L220 190 C220 184 232 184 232 190 L232 200 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M104 110 L104 100 C104 94 114 94 114 100 L114 110 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M20 262 L20 252 C20 246 32 246 32 252 L32 262 Z" fill="url(#ks-raam)"/>
    <path class="raam" d="M368 262 L368 252 C368 246 380 246 380 252 L380 262 Z" fill="url(#ks-raam)"/>
  </g>

  <!-- poort met hartje en trapje -->
  <path d="M170 312 L170 258 C170 234 230 234 230 258 L230 312 Z" fill="#7a3fb0" stroke="#5a2a88" stroke-width="3"/>
  <path d="M200 250 C200 250 200 312 200 312" stroke="#5a2a88" stroke-width="2"/>
  <circle cx="192" cy="286" r="2.5" fill="#ffd54f"/>
  <circle cx="208" cy="286" r="2.5" fill="#ffd54f"/>
  <path d="M200 228 C196 222 188 224 188 230 C188 236 200 242 200 242 C200 242 212 236 212 230 C212 224 204 222 200 228 Z" fill="#ff6fae" stroke="#b8407e" stroke-width="2"/>
  <path d="M160 312 L240 312 L246 322 L154 322 Z" fill="#e9d4f0" stroke="#9c6aa8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- klimrozen langs de muren -->
  <path d="M96 312 C104 290 94 270 104 250 C112 236 104 222 112 208" fill="none" stroke="#5aa84a" stroke-width="3" stroke-linecap="round"/>
  <path d="M304 312 C296 292 306 274 296 256 C290 244 298 230 290 216" fill="none" stroke="#5aa84a" stroke-width="3" stroke-linecap="round"/>
  <g fill="#ff5c9f" stroke="#b8407e" stroke-width="1.5">
    <circle cx="100" cy="296" r="5"/><circle cx="103" cy="262" r="5"/><circle cx="108" cy="228" r="4.5"/>
    <circle cx="300" cy="298" r="5"/><circle cx="298" cy="262" r="5"/><circle cx="293" cy="230" r="4.5"/>
  </g>

  <!-- eigen heuveltje in de kleur van de heuvel: het kasteel staat er altijd óp -->
  <path d="M-40 380 C30 340 110 306 200 304 C290 306 370 340 440 380 Z" fill="#6a4fa3"/>
  <path d="M70 330 C120 314 160 310 200 310 C240 310 280 314 330 330" fill="none" stroke="#7d62b6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
